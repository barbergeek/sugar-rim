<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Cocktail Menu</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      background: #0a0b1e; color: #fff; cursor: none;
      font-family: system-ui, sans-serif;
      display: flex; align-items: center; justify-content: center; text-align: center;
    }
    main { max-width: 70vw; }
    h1 { font-size: 6vh; margin: 0 0 3vh; }
    p { font-size: 3vh; line-height: 1.5; color: rgba(255, 255, 255, 0.7); margin: 0 0 2vh; }
    code { color: #f9d423; }
  </style>
</head>
<body>
  <main>
    <h1>No menu link yet</h1>
    <p>In sugar-rim, open Manage → Holiday Menu and publish a menu, then copy the display link
      into <code>~/.config/cocktail-menu/url</code> on this console.</p>
    <p>Press <strong>Select + Start</strong> to go back to the games.</p>
  </main>
</body>
</html>
