services:
  sugar-rim:
    image: scotthoge/sugar-rim:latest
    container_name: sugar-rim
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - sugar-rim-config:/config
    environment:
      # Optional: pre-seed these so you don't need the Settings tab at all.
      # Left unset (blank), the values saved in Settings are used. A value set
      # here wins over Settings again on every restart.
      - BA_API_URL=${BA_API_URL:-}
      - BA_API_TOKEN=${BA_API_TOKEN:-}
      - BA_BAR_ID=${BA_BAR_ID:-}
      - SECRET_KEY=${SECRET_KEY:-}

volumes:
  sugar-rim-config:
