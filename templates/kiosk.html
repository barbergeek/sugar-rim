<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sugar Rim</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ asset_url('css/style.css') }}">
</head>
<body class="kiosk-mode">

  <header id="app-header">
    <span class="app-title">Sugar Rim</span>
    <span id="header-subtitle" class="header-subtitle"></span>
    <div class="header-view-controls">
      <button class="shelf-toggle-btn hidden" id="header-shelf-toggle" onclick="Cocktails.toggleShelf()"></button>
      <button class="shelf-toggle-btn" id="header-fav-shelf-toggle" onclick="Favorites.toggleShelf()">Shelf only</button>
    </div>
    <button id="logout-btn" class="btn btn-ghost btn-sm hidden" style="padding: 4px 8px; font-size: 0.75rem" onclick="App.auth.logout()">Logout</button>
  </header>

  <main id="app-main">

    <!-- ── COCKTAILS (kiosk: popup filters + featured pick + results) ─ -->
    <section id="view-cocktails" class="view">

      <!-- Filter bar: popup pickers + clear -->
      <div class="kf-filterbar">
        <button class="kf-fbtn" id="kf-ing-btn" onclick="KioskApp.openIngredients()">
          <span class="material-symbols-rounded">liquor</span>
          <span>Ingredients</span>
          <span class="kf-fbtn-count" id="kf-ing-count">0</span>
        </button>
        <button class="kf-fbtn" id="kf-tag-btn" onclick="KioskApp.openTags()">
          <span class="material-symbols-rounded">label</span>
          <span>Tags</span>
          <span class="kf-fbtn-count" id="kf-tag-count">0</span>
        </button>
        <button class="kf-fbtn clear" id="kf-clear-btn" onclick="KioskApp.clearAll()" disabled>
          <span class="material-symbols-rounded">close</span>
          <span>Clear</span>
        </button>
        <button class="kf-toggle on" id="kf-shelf-toggle" onclick="KioskApp.toggleShelfOnly()">
          <span class="material-symbols-rounded">inventory_2</span>
          <span>Shelf only</span>
          <span class="kf-toggle-state" id="kf-shelf-state">On</span>
        </button>
        <span class="kf-found" id="kf-found">—</span>
      </div>

      <!-- Featured random pick -->
      <div class="kf-feature empty" id="kf-feature">
        <div class="kf-feature-info"><span class="kf-feature-name">Loading…</span></div>
      </div>

      <!-- All matching cocktails -->
      <div class="kf-results" id="kf-results">
        <div class="kf-results-msg">Loading cocktails…</div>
      </div>

    </section>

    <!-- ── COCKTAIL DETAIL ────────────────────────────────────────── -->
    <section id="view-detail" class="view">
      <div class="view-toolbar">
        <button class="btn btn-ghost" onclick="App.nav.back()">← Back</button>
        <span id="detail-title" class="toolbar-title"></span>
        <button class="btn btn-ghost" id="detail-fav-btn" onclick="App.cocktails.toggleFav()">☆</button>
        <button class="btn btn-ghost" id="unit-toggle-btn" onclick="App.cocktails.toggleUnit()">oz</button>
      </div>
      <div id="detail-body" class="detail-body"></div>
    </section>

    <!-- ── FAVORITES ──────────────────────────────────────────────── -->
    <section id="view-favorites" class="view">
      <div class="view-toolbar">
        <span class="toolbar-title">Favorites</span>
        <button class="shelf-toggle-btn" id="fav-shelf-toggle" onclick="Favorites.toggleShelf()">Shelf only</button>
        <select class="sort-select" id="fav-sort" onchange="Favorites.setSort(this.value)">
          <option value="name-asc">A-Z</option>
          <option value="name-desc">Z-A</option>
          <option value="rating-desc">Rating ★</option>
        </select>
      </div>
      <div id="favorites-list" class="card-grid"></div>
      <div id="favorites-empty" class="empty-state hidden"><p>No favorites yet.</p></div>
    </section>

    <!-- ── SHELF ──────────────────────────────────────────────────── -->
    <section id="view-shelf" class="view">
      <div class="view-toolbar">
        <input type="search" id="shelf-search" placeholder="Search ingredients…" class="search-input">
        <button class="btn btn-primary" onclick="App.shelf.showAddModal()">+ Add</button>
      </div>
      <div id="shelf-list" class="card-grid"></div>
      <div id="shelf-empty" class="empty-state hidden">
        <p>Your bar shelf is empty.</p>
        <button class="btn btn-primary" onclick="App.shelf.showAddModal()">Add Ingredients</button>
      </div>
    </section>

    <!-- ── SHOPPING LIST ──────────────────────────────────────────── -->
    <section id="view-shopping-list" class="view">
      <div class="view-toolbar">
        <button class="btn btn-ghost" onclick="App.nav.back()">← Back</button>
        <span class="toolbar-title">Shopping List</span>
        <button class="btn btn-ghost" onclick="App.shoppingList.clearAll()">Clear all</button>
      </div>
      <div id="shopping-list-items" class="card-grid"></div>
      <div id="shopping-list-empty" class="empty-state hidden"><p>Your shopping list is empty.</p></div>
    </section>

    <!-- ── STUB VIEWS (keep app.js element refs alive) ────────────── -->
    <section id="view-manage" class="view"></section>
    <section id="view-ingredients" class="view">
      <div class="view-toolbar">
        <button class="btn btn-ghost" onclick="App.nav.go('manage')">← Back</button>
        <input type="search" id="ingredient-search" placeholder="Search ingredients…" class="search-input">
        <select class="sort-select" id="ingredient-sort" onchange="App.ingredients.setSort(this.value)">
          <option value="name-asc">A-Z</option><option value="name-desc">Z-A</option>
          <option value="strength-desc">ABV ↓</option><option value="strength-asc">ABV ↑</option>
        </select>
      </div>
      <div id="ingredient-list" class="card-grid"></div>
      <div id="ingredient-empty" class="empty-state hidden"><p>No ingredients found.</p></div>
      <div class="pagination-bar" id="ingredient-pagination"></div>
    </section>
    <section id="view-tokens" class="view">
      <div class="view-toolbar">
        <button class="btn btn-ghost" onclick="App.nav.go('manage')">← Back</button>
        <span class="toolbar-title">API Tokens</span>
        <button class="btn btn-primary" onclick="App.tokens.showCreate()">+ New</button>
      </div>
      <div id="token-list" class="card-grid"></div>
      <div id="token-empty" class="empty-state hidden"><p>No tokens.</p></div>
      <div class="detail-body"><div class="detail-section"><h3>Token Abilities</h3></div></div>
    </section>
    <section id="view-users" class="view">
      <div class="view-toolbar">
        <button class="btn btn-ghost" onclick="App.nav.go('manage')">← Back</button>
        <span class="toolbar-title">Users</span>
        <button class="btn btn-primary" onclick="App.users.showCreate()">+ New</button>
      </div>
      <div id="user-list" class="card-grid"></div>
      <div id="user-empty" class="empty-state hidden"><p>No users.</p></div>
    </section>
    <section id="view-glasses" class="view">
      <div class="view-toolbar">
        <button class="btn btn-ghost" onclick="App.nav.go('manage')">← Back</button>
        <span class="toolbar-title">Glasses</span>
        <button class="btn btn-primary" onclick="App.glasses.showCreate()">+ New</button>
      </div>
      <div id="glass-list" class="card-grid"></div>
      <div id="glass-empty" class="empty-state hidden"><p>No glasses.</p></div>
    </section>
    <section id="view-methods" class="view">
      <div class="view-toolbar">
        <button class="btn btn-ghost" onclick="App.nav.go('manage')">← Back</button>
        <span class="toolbar-title">Methods</span>
        <button class="btn btn-primary" onclick="App.methods.showCreate()">+ New</button>
      </div>
      <div id="method-list" class="card-grid"></div>
      <div id="method-empty" class="empty-state hidden"><p>No methods.</p></div>
    </section>
    <section id="view-stats" class="view">
      <div class="view-toolbar">
        <button class="btn btn-ghost" onclick="App.nav.go('manage')">← Back</button>
        <span class="toolbar-title">Bar Statistics</span>
      </div>
      <div id="stats-body" class="stats-grid"></div>
    </section>

    <!-- Stub elements app.js may write to -->
    <div id="cocktail-list" style="display:none"></div>
    <div id="cocktail-empty" style="display:none"></div>
    <div id="cocktail-pagination" style="display:none"></div>
    <input id="cocktail-search" style="display:none">
    <input id="ing-filter-input" style="display:none">
    <span id="ing-chips" style="display:none"></span>
    <span id="tag-chips" style="display:none"></span>
    <ul id="ing-autocomplete" style="display:none"></ul>
    <button id="filter-clear-btn" style="display:none"></button>
    <button id="shelf-only-toggle" style="display:none"></button>
    <button id="tag-filter-btn" style="display:none"></button>
    <select id="cocktail-sort" style="display:none"></select>
    <span id="ing-token-box" style="display:none"></span>
    <span id="ing-filter-wrap" style="display:none"></span>

  </main>

  <!-- ── LOGIN ──────────────────────────────────────────────────────── -->
  <section id="view-login" class="view" style="justify-content:center;align-items:center;padding:20px;background:var(--bg-deep);">
    <div class="settings-form" style="background:var(--bg-glass);border:1px solid var(--border);border-radius:16px;padding:32px;width:100%;max-width:400px;backdrop-filter:var(--blur)">
      <h1 class="app-title" style="font-family:var(--font-display);font-size:2rem;margin-bottom:24px;text-align:center">Sugar Rim</h1>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" id="login-email" class="text-input" placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="login-pass" class="text-input" placeholder="••••••••" onkeydown="if(event.key==='Enter') App.auth.login()">
      </div>
      <button class="btn btn-primary btn-wide" style="margin-top:12px" onclick="App.auth.login()">Login</button>
      <div id="login-msg" class="cfg-status" style="margin-top:12px;text-align:center"></div>
    </div>
  </section>

  <nav id="app-nav">
    <button class="nav-btn active" data-view="cocktails" onclick="App.nav.go('cocktails')">
      <span class="nav-icon material-symbols-rounded">local_bar</span>
      <span class="nav-label">Cocktails</span>
    </button>
    <button class="nav-btn" data-view="favorites" onclick="App.nav.go('favorites')">
      <span class="nav-icon material-symbols-rounded">star</span>
      <span class="nav-label">Favorites</span>
    </button>
    <button class="nav-btn" data-view="shelf" onclick="App.nav.go('shelf')">
      <span class="nav-icon material-symbols-rounded">liquor</span>
      <span class="nav-label">Shelf</span>
    </button>
    <button class="nav-btn" data-view="shopping-list" onclick="App.nav.go('shopping-list')">
      <span class="nav-icon material-symbols-rounded">shopping_cart</span>
      <span class="nav-label">List</span>
    </button>
  </nav>

  <div id="modal-overlay" class="modal-overlay hidden" onclick="App.modal.closeOnBackdrop(event)">
    <div class="modal-box" id="modal-box">
      <div class="modal-header">
        <h3 id="modal-title"></h3>
        <button id="modal-close" class="modal-close" onclick="App.modal.close()">✕</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer" id="modal-footer"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script>window.KIOSK = true;</script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
  <script src="{{ asset_url('js/app.js') }}"></script>
  <script>
  // ── KioskApp: popup ingredient/tag pickers → featured pick + results list ──
  // Ingredients / Tags buttons open full-list pickers (tap to highlight, no
  // checkboxes). Matches show as a featured random pick plus a results grid.

  const KioskApp = {
    ingFilters: new Map(),  // id → name
    tagFilters: new Map(),  // id → name
    shelfOnly: true,        // default: only my shelf / makeable cocktails
    _ingShelf: [],          // shelf ingredients (for picker when shelfOnly)
    _ingAll: null,          // all ingredients (lazy; for picker when !shelfOnly)
    _ingItems: [],          // active ingredient list shown in the picker
    _tagItems: [],          // full tag list for the picker
    pool: [],
    poolMeta: null,
    current: null,          // featured cocktail
    _seq: 0,                // guards out-of-order pool loads
    _initialized: false,

    // ── Init ──────────────────────────────────────────────────────────
    async init() {
      if (this._initialized) return;
      this._initialized = true;
      try { const v = localStorage.getItem('kf-shelf-only'); this.shelfOnly = (v === null) ? true : (v === '1'); } catch(e) {}
      this._syncShelfToggle();
      await Promise.all([this._loadShelf(), this._loadTags()]);
      await this._refreshIngList();
      await this.loadPool();
    },

    async _loadShelf() {
      try {
        const d = await get('/api/shelf');
        this._ingShelf = (d.data || [])
          .map(i => ({ id: i.ingredient?.id || i.id, name: i.ingredient?.name || i.name || '' }))
          .filter(i => i.id && i.name)
          .sort((a, b) => a.name.localeCompare(b.name));
      } catch(e) { this._ingShelf = []; }
    },

    async _loadAllIngredients() {
      try {
        const d = await get('/api/ingredients', { per_page: 250, sort: 'name' });
        this._ingAll = (d.data || [])
          .map(i => ({ id: i.id, name: i.name }))
          .filter(i => i.id && i.name);
      } catch(e) { this._ingAll = []; }
    },

    // Point _ingItems at the right source for the current shelfOnly mode
    async _refreshIngList() {
      if (this.shelfOnly) { this._ingItems = this._ingShelf; return; }
      if (!this._ingAll) await this._loadAllIngredients();
      this._ingItems = this._ingAll || [];
    },

    async _loadTags() {
      try {
        const d = await get('/api/tags');
        const seen = new Set();
        this._tagItems = (d.data || [])
          .filter(t => { const k = t.name.toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; })
          .sort((a, b) => a.name.localeCompare(b.name));
      } catch(e) { this._tagItems = []; }
    },

    // ── Shelf-only toggle ──────────────────────────────────────────────
    async toggleShelfOnly() {
      this.shelfOnly = !this.shelfOnly;
      try { localStorage.setItem('kf-shelf-only', this.shelfOnly ? '1' : '0'); } catch(e) {}
      this._syncShelfToggle();
      await this._refreshIngList();
      this.loadPool();
    },

    _syncShelfToggle() {
      const b = document.getElementById('kf-shelf-toggle');
      if (!b) return;
      b.classList.toggle('on', this.shelfOnly);
      const s = document.getElementById('kf-shelf-state');
      if (s) s.textContent = this.shelfOnly ? 'On' : 'Off';
    },

    // ── Pickers (popups) ───────────────────────────────────────────────
    openIngredients() { this._openPicker('ing'); },
    openTags()        { this._openPicker('tag'); },

    _openPicker(kind) {
      const isIng = kind === 'ing';
      const items = isIng ? this._ingItems : this._tagItems;
      const sel   = isIng ? this.ingFilters : this.tagFilters;
      const title = isIng ? 'Choose Ingredients' : 'Choose Tags';

      if (!items.length) {
        Toast.show(isIng ? (this.shelfOnly ? 'Your shelf is empty.' : 'No ingredients found.') : 'No tags available.');
        return;
      }

      const body = '<div class="kf-picker">' +
        items.map(i => `<button class="kf-ptile${sel.has(i.id) ? ' active' : ''}" data-id="${i.id}">${escHtml(i.name)}</button>`).join('') +
        '</div>';
      const footer =
        `<button class="btn btn-ghost btn-wide" onclick="KioskApp.clearKind('${kind}')">Clear selection</button>` +
        `<button class="btn btn-primary btn-wide" id="kf-picker-done" onclick="App.modal.close()">${this._doneLabel()}</button>`;

      App.modal.open(title, body, footer);
      this._activePicker = kind;

      document.querySelectorAll('#modal-body .kf-ptile').forEach(btn => {
        btn.onclick = () => this._togglePick(kind, parseInt(btn.dataset.id, 10), btn);
      });
    },

    _togglePick(kind, id, btn) {
      const isIng = kind === 'ing';
      const sel   = isIng ? this.ingFilters : this.tagFilters;
      const items = isIng ? this._ingItems : this._tagItems;
      const item  = items.find(x => x.id === id);
      if (sel.has(id)) sel.delete(id);
      else sel.set(id, item ? item.name : '');
      if (btn) btn.classList.toggle('active', sel.has(id));
      this._syncControls();
      this.loadPool();
    },

    clearKind(kind) {
      const sel = kind === 'ing' ? this.ingFilters : this.tagFilters;
      sel.clear();
      document.querySelectorAll('#modal-body .kf-ptile').forEach(b => b.classList.remove('active'));
      this._syncControls();
      this.loadPool();
    },

    clearAll() {
      this.ingFilters.clear();
      this.tagFilters.clear();
      this._syncControls();
      this.loadPool();
    },

    _syncControls() {
      const ingN = this.ingFilters.size, tagN = this.tagFilters.size;
      const set = (id, n, btnId) => {
        const c = document.getElementById(id);
        if (c) { c.textContent = n; c.classList.toggle('show', n > 0); }
        const b = document.getElementById(btnId);
        if (b) b.classList.toggle('active', n > 0);
      };
      set('kf-ing-count', ingN, 'kf-ing-btn');
      set('kf-tag-count', tagN, 'kf-tag-btn');
      const clearBtn = document.getElementById('kf-clear-btn');
      if (clearBtn) clearBtn.disabled = (ingN + tagN) === 0;
    },

    // ── Pool loading ──────────────────────────────────────────────────
    async loadPool() {
      const seq = ++this._seq;
      const params = { per_page: 100, sort: 'name' };
      if (this.shelfOnly) params['filter[on_shelf]'] = true;
      if (this.ingFilters.size) params['filter[ingredient_name][]'] = [...this.ingFilters.values()];
      if (this.tagFilters.size) params['filter[tag_id][]'] = [...this.tagFilters.keys()];

      let pool = [], meta = null;
      try {
        const d = await get('/api/cocktails', params);
        pool = d.data || [];
        meta = d.meta;
      } catch(e) { /* leave empty */ }

      if (seq !== this._seq) return;  // a newer load superseded this one
      this.pool = pool;
      this.poolMeta = meta;

      this._pickCurrent();
      this._renderFeature();
      this._renderResults();
      this._updateFound();
      this._updatePickerDone();
    },

    _total() {
      const n = this.pool.length;
      return this.poolMeta && this.poolMeta.total > n ? this.poolMeta.total : n;
    },
    _doneLabel() {
      const t = this._total();
      return t === 0 ? 'No matches' : (t === 1 ? 'Show 1 recipe' : 'Show ' + t + ' recipes');
    },
    _updateFound() {
      const el = document.getElementById('kf-found');
      if (!el) return;
      const t = this._total();
      el.textContent = t === 0 ? 'None found' : (t === 1 ? '1 found' : t + ' found');
    },
    _updatePickerDone() {
      const done = document.getElementById('kf-picker-done');
      if (done) done.textContent = this._doneLabel();
    },

    // Keep featured pick if still in pool, else pick a fresh random one
    _pickCurrent() {
      if (!this.pool.length) { this.current = null; return; }
      const keep = this.current && this.pool.find(c => c.id === this.current.id);
      this.current = keep || this.pool[Math.floor(Math.random() * this.pool.length)];
    },

    shuffle() {
      if (this.pool.length < 2) return;
      let next;
      do { next = this.pool[Math.floor(Math.random() * this.pool.length)]; }
      while (this.current && next.id === this.current.id);
      this.current = next;
      this._renderFeature();
      this._markFeatured();
    },

    openCurrent() {
      if (this.current) App.cocktails.open(this.current.id);
    },

    // ── Featured pick ──────────────────────────────────────────────────
    _renderFeature() {
      const f = document.getElementById('kf-feature');
      if (!f) return;
      const hasFilters = this.ingFilters.size || this.tagFilters.size;

      if (!this.current) {
        f.className = 'kf-feature empty';
        f.onclick = null;
        f.innerHTML = '<div class="kf-feature-info">' +
          '<span class="kf-feature-eyebrow">' + (hasFilters ? 'No matches' : 'Nothing available') + '</span>' +
          '<span class="kf-feature-name">' + (hasFilters ? 'Try fewer filters' : (this.shelfOnly ? 'Add items to your shelf' : 'No cocktails found')) + '</span>' +
          '</div>';
        return;
      }

      const c = this.current;
      const ings = (c.ingredients && c.ingredients.length)
        ? c.ingredients.filter(i => !i.optional).map(i => i.ingredient && i.ingredient.name).filter(Boolean)
        : (c.short_ingredients || []);
      const ingLine = ings.join(' · ');

      f.className = 'kf-feature';
      f.onclick = () => this.openCurrent();
      f.innerHTML =
        '<div class="kf-feature-img" id="kf-feature-img"><span class="material-symbols-rounded">local_bar</span></div>' +
        '<div class="kf-feature-info">' +
          '<span class="kf-feature-eyebrow">Featured pick</span>' +
          '<span class="kf-feature-name">' + escHtml(c.name) + '</span>' +
          (ingLine ? '<span class="kf-feature-ings">' + escHtml(ingLine) + '</span>' : '') +
          '<div class="kf-feature-actions">' +
            '<button class="kf-feature-btn primary" onclick="event.stopPropagation();KioskApp.openCurrent()">' +
              'View Recipe <span class="material-symbols-rounded">arrow_forward</span></button>' +
            '<button class="kf-feature-btn ghost" onclick="event.stopPropagation();KioskApp.shuffle()">' +
              '<span class="material-symbols-rounded">casino</span> Shuffle</button>' +
          '</div>' +
        '</div>';

      this._enrichFeatureImg(c.id);
    },

    async _enrichFeatureImg(id) {
      try {
        const cached = Cocktails._cache.get(id);
        const data   = cached || (await get('/api/cocktails/' + id)).data;
        if (!cached) Cocktails._cache.set(id, data);
        if (!this.current || this.current.id !== id) return;  // changed while fetching
        const box = document.getElementById('kf-feature-img');
        if (box && data.images && data.images[0]) {
          box.innerHTML = '';
          const img = document.createElement('img');
          img.src = '/api/images/' + data.images[0].id + '/thumb';
          box.appendChild(img);
        }
      } catch(e) { /* keep placeholder */ }
    },

    // ── Results list ───────────────────────────────────────────────────
    _renderResults() {
      const grid = document.getElementById('kf-results');
      if (!grid) return;
      if (!this.pool.length) {
        const hasFilters = this.ingFilters.size || this.tagFilters.size;
        grid.innerHTML = '<div class="kf-results-msg">' +
          (hasFilters ? 'No cocktails match those filters.'
                      : (this.shelfOnly ? 'No cocktails you can make yet — add to your shelf.' : 'No cocktails found.')) + '</div>';
        return;
      }
      grid.innerHTML = this.pool.map(c => Cocktails._card(c)).join('');
      Cocktails._enrichCards(this.pool);
      this._markFeatured();
    },

    _markFeatured() {
      const grid = document.getElementById('kf-results');
      if (!grid) return;
      grid.querySelectorAll('.cocktail-card.is-featured').forEach(el => el.classList.remove('is-featured'));
      if (this.current) {
        const card = grid.querySelector('.cocktail-card[data-id="' + this.current.id + '"]');
        if (card) card.classList.add('is-featured');
      }
    },
  };

  // ── Wire into App lifecycle ────────────────────────────────────────────────
  (function () {
    // UIScale: default 125% for kiosk when no stored preference
    UIScale.get = function() {
      const stored = localStorage.getItem(UIScale.KEY);
      if (!stored) return 125;
      return parseInt(stored, 10);
    };

    // After App.init completes (auth checked, cocktails view active), launch kiosk UI
    const _origInit = App.init.bind(App);
    App.init = async function () {
      await _origInit();
      if (App._loggedIn) KioskApp.init();
    };
  })();
  </script>
</body>
</html>
